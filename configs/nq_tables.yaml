# CRAFT configuration for NQ-Tables.
#   craft preprocess --config configs/nq_tables.yaml
#   craft retrieve   --config configs/nq_tables.yaml

data:
  dataset: nq
  corpus_file:  datasets/NQ_Tables/tables/tables.jsonl          # 169,898 tables
  queries_file: datasets/NQ_Tables/interactions/combined.jsonl  # 966 questions
  output_dir:   results/nq_tables
  corpus_fields: title+headers+description+cells
  query_type: query+subquestion+description
  # Pre-generated per-table titles/descriptions (optional). Leave blank to
  # generate them with the LLM step below instead.
  descriptions_file: datasets/nq_table_summary_table_description.jsonl

# Optional LLM enrichment. Disabled by default; enable to generate table
# titles/descriptions (and, if you want, query expansions) before indexing.
generation:
  enabled: false
  backend: vllm                 # vllm | transformers | openai
  model: Qwen/Qwen3-8B
  enrich_tables: true
  expand_queries: false
  max_new_tokens: 512
  batch_size: 64
  sample_rows: 10

stage1:
  model_id: naver/splade_v2_distil
  sparse_top_k: 5000
  top_k: 5000
  batch_size: 512

stage2:
  model_id: sentence-transformers/all-mpnet-base-v2
  mode: representative_row       # representative_row (default) | mini_table
  top_k: 100
  top_k_rows: 5
  batch_size: 4096

stage3:
  enabled: false                 # auto-enabled when OPENAI_API_KEY is set
  provider: openai
  model_id: text-embedding-3-large
  top_k: 50
  api_batch: 100
  api_sleep: 0.5

cuda_devices: "0,1"
log_file: craft_nq.log
eval_ks: [1, 10, 50, 100, 500, 5000]
