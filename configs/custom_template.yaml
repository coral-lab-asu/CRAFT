# CRAFT configuration template for your own dataset.
# Copy this file, fill in the paths, then run:
#   craft preprocess --config configs/my_dataset.yaml
#   craft retrieve   --config configs/my_dataset.yaml

data:
  dataset: custom                # "custom" uses the generic JSONL loader

  # Corpus: one JSON object per line, with keys
  #   table_id, title, headers, rows, and (optionally) description.
  corpus_file: /path/to/corpus.jsonl

  # Queries: one JSON object per line, with keys
  #   qid, question, gold_table_ids, and (optionally) subquestion, answer.
  queries_file: /path/to/queries.jsonl

  output_dir: results/custom
  corpus_fields: title+headers+description+cells
  query_type: query+subquestion  # or just "query" if you have no sub-questions

# Optional: generate table titles/descriptions (and query expansions) with a
# small open-source model before indexing. Requires the [vllm] extra.
generation:
  enabled: false
  backend: vllm                  # vllm | transformers | openai
  model: Qwen/Qwen3-8B
  enrich_tables: true
  expand_queries: false
  max_new_tokens: 512
  batch_size: 64
  sample_rows: 10

stage1:
  model_id: naver/splade_v2_distil
  sparse_top_k: 5000
  top_k: 5000
  batch_size: 128

stage2:
  model_id: sentence-transformers/all-mpnet-base-v2
  mode: representative_row       # representative_row (default) | mini_table
  top_k: 100
  top_k_rows: 5
  batch_size: 256

stage3:
  enabled: false                 # auto-enabled when an API key is present
  provider: openai               # openai | gemini
  model_id: text-embedding-3-large
  top_k: 50
  api_batch: 100
  api_sleep: 0.5

cuda_devices: "0"
log_file: craft_custom.log
eval_ks: [1, 10, 50, 100]
