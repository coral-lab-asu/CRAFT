# CRAFT configuration for OTT-QA.
#   craft preprocess --config configs/ottqa.yaml
#   craft retrieve   --config configs/ottqa.yaml

data:
  dataset: ottqa
  corpus_file:  datasets/OTT-QA/all_plain_tables.json     # 419,183 tables
  queries_file: datasets/OTT-QA/released_data/dev.json    # 2,214 questions
  output_dir:   results/ottqa
  # For OTT-QA the description is intro + section_title + section_text (built
  # by the loader), so no separate descriptions file is needed.
  corpus_fields: title+headers+description+cells
  query_type: query+subquestion

generation:
  enabled: false
  backend: vllm
  model: Qwen/Qwen3-8B
  enrich_tables: true
  expand_queries: false
  max_new_tokens: 512
  batch_size: 64
  sample_rows: 10

stage1:
  model_id: naver/splade_v2_distil
  sparse_top_k: 5000
  top_k: 5000
  batch_size: 128

stage2:
  # JINA v3 is used for OTT-QA in the paper; trust_remote_code is handled
  # automatically when "jina" appears in the model id.
  model_id: jinaai/jina-embeddings-v3
  mode: representative_row
  top_k: 100
  top_k_rows: 5
  batch_size: 128

stage3:
  enabled: false                 # auto-enabled when GEMINI_API_KEY is set
  provider: gemini
  model_id: gemini-embedding-001
  top_k: 50
  api_batch: 100
  api_sleep: 1.0

cuda_devices: "0,1"
log_file: craft_ottqa.log
eval_ks: [1, 10, 50, 100, 500]
